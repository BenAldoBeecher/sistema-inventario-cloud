
# Pipeline de integracion continua del sistema de inventario.

name: Validacion del proyecto

# Ejecutar cuando se actualice main o se cree un pull request.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Permisos minimos necesarios para el pipeline.
permissions:
  contents: read

jobs:
  pruebas-y-validaciones:
    name: Pruebas y validaciones
    runs-on: ubuntu-24.04

    steps:
      # Obtener el codigo del repositorio sin conservar credenciales Git.
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Configurar Node.js.
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Instalar las dependencias.
      - name: Instalar dependencias
        run: npm ci

      # Ejecutar las pruebas automatizadas.
      - name: Ejecutar pruebas automatizadas
        run: npm test

      # Configurar Terraform.
      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.17.0

      # Verificar el formato de los archivos Terraform.
      - name: Verificar formato Terraform
        run: terraform -chdir=terraform fmt -check -recursive

      # Inicializar Terraform sin configurar un backend remoto.
      - name: Inicializar Terraform
        run: terraform -chdir=terraform init -backend=false

      # Validar la configuracion de infraestructura.
      - name: Validar Terraform
        run: terraform -chdir=terraform validate
